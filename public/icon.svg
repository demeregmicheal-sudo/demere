<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#9d1b38" />
      <stop offset="70%" stop-color="#641123" />
      <stop offset="100%" stop-color="#3b0813" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Circle / Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.4" />
  <circle cx="256" cy="256" r="222" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="6,6" opacity="0.6" />

  <!-- Ethiopian Orthodox Geez Cross Icon -->
  <g transform="translate(136, 116) scale(0.47)" filter="url(#shadow)">
    <!-- Central decorative woven cross -->
    <path fill="url(#gold)" d="M256,40 L280,100 L340,100 L290,140 L310,200 L256,160 L202,200 L222,140 L172,100 L232,100 Z" />
    
    <!-- Vertical and Horizontal Bars -->
    <rect x="236" y="80" width="40" height="360" rx="10" fill="url(#gold)" />
    <rect x="76" y="210" width="360" height="40" rx="10" fill="url(#gold)" />
    
    <!-- Cross finials / ornaments -->
    <circle cx="256" cy="70" r="24" fill="url(#gold)" />
    <circle cx="256" cy="450" r="24" fill="url(#gold)" />
    <circle cx="66" cy="230" r="24" fill="url(#gold)" />
    <circle cx="446" cy="230" r="24" fill="url(#gold)" />
    
    <!-- Inner diamond center -->
    <polygon points="256,180 306,230 256,280 206,230" fill="#641123" stroke="url(#gold)" stroke-width="8" />
    <circle cx="256" cy="230" r="14" fill="url(#gold)" />
  </g>

  <!-- Typography / Inscription -->
  <text x="256" y="440" font-family="'Noto Sans Ethiopic', 'Noto Sans', sans-serif" font-size="34" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="1">
    ምክሃ ደናግል
  </text>
  <text x="256" y="475" font-family="'Noto Sans Ethiopic', 'Noto Sans', sans-serif" font-size="20" font-weight="600" fill="#fde68a" opacity="0.85" text-anchor="middle">
    ሰንበት ት/ቤት
  </text>
</svg>
